services:
  caddy:
    container_name: caddy
    image: homelab-caddy:local
    build:
      context: .
      dockerfile: docker/caddy/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - /home/mike/.config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?Cloudflare token required}
    networks:
      - media

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    ports:
      - 3000:3000
    volumes:
      - /home/mike/.config/homepage:/app/config # Make sure your local config directory exists
      - /mnt/media:/media:ro
    environment:
      HOMEPAGE_ALLOWED_HOSTS: media.local:3000,media:3000,media.gate-rohu.ts.net:3000,homepage.bowmanmike.com # required, may need port. See gethomepage.dev/installation/#homepage_allowed_hosts
      PUID: 1000
      PGID: 1000
    networks:
      - media

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto
    volumes:
      - /home/mike/.config/jellyfin:/config
      - /mnt/media:/media
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "44"
      - "993"
    ports:
      - "8096:8096"
    restart: unless-stopped
    networks:
      - media

  navidrome:
    container_name: navidrome
    image: deluan/navidrome:latest
    user: 1000:1000 # should be owner of volumes
    ports:
      - "4533:4533"
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto
      - ND_LASTFM_APIKEY=${LASTFM_API_KEY}
      - ND_LASTFM_SECRET=${LASTFM_API_SECRET}
    volumes:
      - /home/mike/.config/navidrome:/data
      - /mnt/media/music:/music:ro
    networks:
      - media

  feishin:
    container_name: feishin
    image: 'ghcr.io/jeffvli/feishin:latest'
    restart: unless-stopped
    environment:
        # - SERVER_NAME=Navidrome # pre-defined server name
        - SERVER_LOCK=false # When true AND name/type/url are set, only username/password can be toggled
        # - SERVER_TYPE=navidrome # the allowed types are: jellyfin, navidrome, subsonic. These values are case insensitive
        # - SERVER_URL=https://navidrome.bowmanmike.com # http://address:port or https://address:port
        # - LEGACY_AUTHENTICATION=false # When SERVER_LOCK is true, sets the legacy (plaintext) authentication flag for Subsonic/OpenSubsonic servers
        - ANALYTICS_DISABLED=true # Set to true to disable Umami analytics tracking
    ports:
        - 9180:9180
    networks:
      - media

  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "9091:9091"
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${GLUETUN_WIREGUARD_KEY}
      - SERVER_COUNTRIES=Canada,United States
      - VPN_PORT_FORWARDING=on
      - PORT_FORWARD_ONLY=on
    restart: unless-stopped
    volumes:
      - ./gluetun:/tmp/gluetun
    networks:
      - media

  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto
    volumes:
      - /home/mike/.config/transmission:/config
      - /mnt/media/downloads:/downloads
      - /mnt/media/watch:/watch
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy

  transmission-port-sync:
    image: curlimages/curl:latest
    container_name: transmission-port-sync
    user: "0:0"
    volumes:
      - ./gluetun:/gluetun:ro
      - ./scripts/transmission-port-update.sh:/update-port.sh:ro
    entrypoint: ["/bin/sh", "/update-port.sh"]
    depends_on:
      - gluetun
      - transmission
    restart: unless-stopped
    networks:
      - media

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto
    volumes:
      - /home/mike/.config/sonarr:/config
      - /mnt/media:/media
      # - /mnt/media/tv:/tv                 # final TV library
      # - /mnt/media/downloads:/downloads   # where new stuff lands
    ports:
      - "8989:8989"            # Sonarr web UI
    networks:
      - media

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto
    volumes:
      - /home/mike/.config/radarr:/config
      - /mnt/media:/media
      # - /mnt/media/movies:/movies
      # - /mnt/media/downloads:/downloads
    ports:
      - "7878:7878"
    networks:
      - media

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /home/mike/.config/lidarr:/config
      - /mnt/media:/media
      # - /mnt/media/music:/music
      # - /mnt/media/downloads:/downloads #optional
    ports:
      - 8686:8686
    restart: unless-stopped
    networks:
      - media

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto
    volumes:
      - /home/mike/.config/prowlarr:/config
    ports:
      - "9696:9696"
    networks:
      - media

  syncthing:
    image: syncthing/syncthing:latest
    container_name: syncthing
    hostname: my-syncthing
    environment:
      - PUID=1000
      - PGID=1000
      # - STGUIADDRESS=
    volumes:
      - /home/mike/syncthing:/data
      - /home/mike/.config/syncthing:/var/syncthing/config
    network_mode: host
    restart: unless-stopped
    ports:
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    healthcheck:
      test: curl -fkLsS -m 2 127.0.0.1:8384/rest/noauth/health | grep -o --color=never OK || exit 1
      interval: 1m
      timeout: 10s
      retries: 3

  homelab:
    image: ghcr.io/bowmanmike/homelab:latest
    container_name: homelab
    restart: unless-stopped
    volumes:
      - /home/mike/.config/homelab/data:/data
      - /var/run:/tmp/host/run:ro
      - /proc/uptime:/tmp/host/uptime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /home/mike/media-server/docker-compose.yml:/tmp/host/docker-compose.yml:ro
    ports:
      - "4000:4000"
    environment:
      - SECRET_KEY_BASE=${HOMELAB_SECRET_KEY_BASE}
      - DATABASE_PATH=${HOMELAB_DB_PATH}
      - PHX_HOST=${HOMELAB_PHX_HOST}
      - REBOOT_REQUIRED_PATH=/tmp/host/run/reboot-required
      - UPTIME_PATH=/tmp/host/uptime
      - DOCKER_SOCKET_PATH=/var/run/docker.sock
      - DOCKER_API_BASE_URL=http:///v1.52
      - DOCKER_API_HOST_HEADER=docker
      - DOCKER_COMPOSE_FILE_PATH=${HOMELAB_DOCKER_COMPOSE_FILE_PATH}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    group_add:
      - 983
    networks:
      - media

  playlistgen:
    image: ghcr.io/bowmanmike/playlistgen:latest
    container_name: playlistgen
    restart: unless-stopped
    networks:
      - media
    volumes:
      - /mnt/media/music:/library:ro
      - /home/mike/.config/playlistgen/data:/home/playlistgen/data
      - /mnt/media/music/playlists:/playlists
    environment:
      - NAVIDROME_URL=http://navidrome:4533
      - NAVIDROME_USER=${PLAYLISTGEN_NAVIDROME_USER}
      - NAVIDROME_PASSWORD=${PLAYLISTGEN_NAVIDROME_PASSWORD}
      - OLLAMA_URL=http://ollama:11434
    profiles:
      - tools

  gzclp:
    image: ghcr.io/bowmanmike/gzclp:latest
    container_name: gzclp
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - /home/mike/.config/gzclp/data:/app/storage
    environment:
      - RAILS_MASTER_KEY=${GZCLP_RAILS_MASTER_KEY}
    networks:
      - media

  nebula_sync:
    image: ghcr.io/lovelaze/nebula-sync:latest
    container_name: nebula-sync
    environment:
      - PRIMARY=${NEBULA_SYNC_PRIMARY}
      - REPLICAS=${NEBULA_SYNC_REPLICAS}
      - FULL_SYNC=true
      - CRON=*/15 * * * *
    restart: unless-stopped

  groovelist:
    container_name: groovelist
    image: ghcr.io/bowmanmike/groovelist:latest   # or pin a sha-<short sha> tag
    restart: unless-stopped
    env_file: groovelist.env                      # RAILS_MASTER_KEY=<contents of config/master.key>
    environment:
      SOLID_QUEUE_IN_PUMA: "true"                 # run background jobs inside the web process
    volumes:
      - groovelist_storage:/rails/storage         # all SQLite databases live here
    ports:
      - "3002:3000"


volumes:
  caddy_data:
  caddy_config:
  groovelist_storage:

networks:
  media:
    driver: bridge
